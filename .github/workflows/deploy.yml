name: Remote Deploy & Auto-Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auto-Generate Documentation
        run: |
          python3 scripts/generate_docs.py

      - name: Commit and Push Documentation Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update API and architecture specs [skip ci]"
          file_pattern: 'docs/* README.md'

      - name: Install cloudflared
        run: |
          curl -fL --retry 5 https://github.com/cloudflare/cloudflared/releases/download/2024.6.1/cloudflared-linux-amd64 -o cloudflared || \
          curl -fL --retry 5 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Deploy via Cloudflare Tunnel
        env:
          SSH_HOSTNAME: ${{ secrets.VOLCANO_SSH_HOSTNAME || secrets.SSH_HOSTNAME }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOSTNAME" ] || [ -z "$SERVER_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Error: One or more deployment secrets are missing!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "Host $SSH_HOSTNAME
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            ConnectTimeout 30
            IdentityFile ~/.ssh/id_deploy" > ~/.ssh/config

          ssh "$SERVER_USER@$SSH_HOSTNAME" \
              "cd /home/miles/prod/observer && git fetch origin main && git reset --hard origin/main && docker compose up -d --build operator && sleep 2 && curl -s --retry 5 --retry-connrefused -X POST http://127.0.0.1:8006/deploy -H 'Content-Type: application/json' -d '{\"project\": \"observer\", \"status\": \"success\", \"commit\": \"'\$(git rev-parse --short HEAD)'\", \"actor\": \"${{ github.actor }}\"}'"

      - name: Report CI Failure to Observer & Loki
        if: failure()
        run: |
          curl -s -X POST https://observer.mileshillary.com/ci/failure \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "actor": "${{ github.actor }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "error_step": "Workflow Execution Failed",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || true
