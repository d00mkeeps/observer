services:
  operator:
    build: ./operator
    container_name: obs-operator
    restart: always
    ports:
      - "127.0.0.1:8006:8000"
    env_file:
      - .env
    volumes:
      - ./operator/cards:/cards:ro
    networks:
      - obs
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  obs:
    external: true
    name: observability
