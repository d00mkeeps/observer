services:
  operator:
    build: ./operator
    container_name: obs-operator
    restart: always
    ports:
      - "127.0.0.1:8006:8000"
    env_file:
      - .env
    volumes:
      - ./operator/cards:/cards:ro
      - ${CODEBASES_PATH:-/home/miles/prod}:/codebases:ro
      - ${DEV_WORKSPACE_PATH:-/home/miles/dev}:/workspace/dev
      - ${SSH_AUTH_DIR:-/home/miles/.ssh}:/root/.ssh:ro
      - ${SKILLS_PATH:-/home/miles/skills}:/skills:ro
    networks:
      - obs
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  obs:
    external: true
    name: observability
